<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 关键：设置 viewport，禁止用户意外缩放导致的操作偏移，并适配屏幕宽度 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>在线盖章工具-多页PDF与固定印章版</title>
    <!-- 使用更稳定的 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root { --primary-color: #1890ff; --bg-color: #f0f2f5; }
        body { 
            font-family: sans-serif; 
            background: var(--bg-color); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
            touch-action: manipulation; /* 优化移动端点击延迟 */
        }
        
        /* 工具栏适配：在小屏幕上自动换行 */
        .toolbar { 
            background: #fff; 
            padding: 10px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
            display: flex; 
            gap: 8px; 
            align-items: center; 
            z-index: 10; 
            flex-wrap: wrap; 
            justify-content: center;
        }

        .btn { 
            padding: 6px 12px; 
            border-radius: 4px; 
            border: 1px solid #d9d9d9; 
            cursor: pointer; 
            font-weight: 500; 
            transition: 0.3s; 
            font-size: 13px; 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            background: white;
            white-space: nowrap;
        }
        .btn-success { background: #52c41a; color: white; border: none; }
        .btn-icon { padding: 4px 10px; font-size: 16px; }
        
        /* PDF 分页控制器 */
        .pdf-controls {
            display: none; /* 默认隐藏，上传PDF后显示 */
            align-items: center;
            gap: 8px;
            background: #f5f5f5;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #e8e8e8;
        }
        .page-info { font-size: 13px; font-weight: bold; color: #333; min-width: 40px; text-align: center;}

        /* 印章选择区域适配 */
        .stamp-selector { display: flex; gap: 8px; align-items: center; padding: 0 5px; border-left: 1px solid #eee; border-right: 1px solid #eee;}
        .stamp-item { width: 35px; height: 35px; border: 2px solid #eee; border-radius: 4px; cursor: pointer; object-fit: contain; background: #fff; }
        .stamp-item:hover { border-color: var(--primary-color); }

        /* 编辑区容器 */
        .main-container { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            padding: 15px; 
            overflow: auto; 
            position: relative;
            -webkit-overflow-scrolling: touch;
        }

        .canvas-wrapper { 
            box-shadow: 0 0 20px rgba(0,0,0,0.2); 
            background: white; 
            position: relative;
            touch-action: none; 
        }
        
        #size-tag {
            position: fixed; background: rgba(0, 0, 0, 0.75); color: white;
            padding: 4px 8px; border-radius: 4px; font-size: 12px;
            pointer-events: none; display: none; z-index: 1000; transform: translate(-50%, -120%);
        }

        #drop-zone {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(24, 144, 255, 0.1); border: 3px dashed var(--primary-color);
            display: none; justify-content: center; align-items: center; z-index: 100; pointer-events: none;
        }
        input[type="file"] { display: none; }
        .loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; background: rgba(0,0,0,0.8); color: white; padding: 20px; border-radius: 8px; z-index: 1000; }

        #status-info { width: 100%; text-align: center; font-size: 12px; color: #999; margin-top: 2px; }

        @media (max-width: 480px) {
            .btn { padding: 5px 8px; font-size: 12px; }
            .stamp-item { width: 30px; height: 30px; }
        }
    </style>
</head>
<body>

<div class="toolbar">
    <button class="btn" onclick="document.getElementById('fileInput').click()">📁 文件</button>
    
    <!-- PDF多页控制器 -->
    <div class="pdf-controls" id="pdf-controls">
        <button class="btn btn-icon" onclick="changePage(-1)">◀</button>
        <span class="page-info" id="page-info">1/1</span>
        <button class="btn btn-icon" onclick="changePage(1)">▶</button>
    </div>

    <!-- 固定印章及上传新印章 -->
    <div class="stamp-selector">
        <img src="" id="previewStamp1" class="stamp-item" title="印章 A" onclick="useFixedStamp(STAMP_1_DATA)">
        <img src="" id="previewStamp2" class="stamp-item" title="印章 B" onclick="useFixedStamp(STAMP_2_DATA)">
        <button class="btn" style="padding: 4px 8px;" onclick="document.getElementById('stampInput').click()" title="上传新印章">➕</button>
    </div>
    
    <select id="orientation" class="btn" onchange="changeOrientation()">
        <option value="portrait">竖向 A4</option>
        <option value="landscape">横向 A4</option>
    </select>
    
    <button class="btn btn-success" onclick="downloadImage()">⬇️ 下载</button>
    
    <div id="status-info">请先上传文件</div>
</div>

<div class="main-container" id="container-view">
    <div class="canvas-wrapper" id="canvas-holder">
        <canvas id="c"></canvas>
    </div>
</div>

<div id="size-tag">100%</div>
<div id="drop-zone"><h2>释放文件开始上传</h2></div>
<div class="loading" id="loading">处理中...</div>

<input type="file" id="fileInput" accept=".pdf, .jpg, .jpeg">
<input type="file" id="stampInput" accept=".png, .jpg, .jpeg">

    const STAMP_2_DATA = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGQAAABkCAYAAABw4pVUAAAAAXNSR0IArs4c6QAABk9JREFUeF7tXFtsVFUUPdfp9IZCC6Y8SkSgUKmAYpBCu7XyUAKCAvGD8pCIUUMUEp7yIBiD8UUTY/wwUfwwYvww+qAfxEejMcYHxA8NoDFAgULBUoFKW3mUTp8pM/tOnT7TaWc605m57cy5vT9zzl5773X2uWfuvVeeI6D0v2MAdgB4E8CbeR0vAfgCwM8AfslrqzK83m39LwLwAoCnS7D9M4DXS/DdrbIKBApAIQAeK5P+PwBMAnixTN/fKqfUBApA6I1hAFcWyZ8A/Fgk22650wQKQHwA8ByAGwF0u8T8G8D7AN4A8K1LrNfEThAoAIUD+BbArW7IDwP4DsByN1iPhS9AoAAUDOBeAC95ID0EYHMePr+M30B8APEEeAbA8z7IXwNwwGf/77EbiA8gXN38CMA0gN0uS9gPYKGL7G+hG4gPIB0AvgCwxmX5XwPY7CL7u+gG4gOICuB1AKtdlP8lgA4Xud9FNxAfQN7MK/9Vp6X/mNfy/6D66AbS2X55C+A1AL90Anw+p30A4BcAH+Z6fT5vYmKiNzw8XOf3+8v7+vo08GfOnDnT39/fXyXvR0VFf5+99Gg0mrlz586pSCSydM6cOdr6Xn9/f7XRaNREqfH69mdfX59S9K9p70f7PTo6mrN+/fpOAI8BeDTP9f7Z39/fN69EAnw+p30AcArARp8An8fR9svS0pIAsBfAzWp5PofTPgDgBQCf5XF9vm9hYWF3dXW19v/pPPN9Dqd9AMCvAD7P8/o1XpM30X+p5V8A4E9R+W3v79ixYz0ALvW6A20PpxYAwH0AdrqVf8O566S79vO2p+Ym9K9l7Xp7ey8AsNal7U3nLpA2Ym7l33S2UfNb+0vbM9qO0f8e914F0kbMrfybzjbC99H2pLZntB2j/z3uvQqkG8BaAHpOf9u907N9D+507f3vUe89vR+lD8R7+f/fA9T696oE9f7eAOCG0vL03D95R4F0ANgGoKuE9M8v8U4N63+A8uPzEsh9ANaW6Pr8R4F0ALgpj99X5O3fI7qA39Swnv9X3vS8BNIJYHtOsq/L+N8VncBvasidmZdA7shZ9o8Vn8AnNczPzEsgdwK4qfR8I6+VnUCoOf2n78y8BNIJ4Dte8vSckv+XpI65rWF9v/Lm5yWQe/K6v8jr5S8QvU5pW9pW9L8vLyG5G8A6Vf0vS1v7S9szvS9Y497T65H6ULyX//89QK1/v/M+8pL86Xv6T61/D0D7S9szvS9Y497T67HeS/On7+k/tf49AO0vbc/0vmCNf68C+SyA6/Kn7+k/Nf98G6X9pe2Z3hes8e9VIH8DeC6f6Xv6T80f76K0v7Q90/uCNf69CiQaNq/S9z7qOf07mYh5O+326X2A9pe2Z3pf6Kof0/uX/p3mJfP6E88v0f0jGjGv59O79S39p+af+N9tK0vbM9qO0f8e917d988BaE9N68+y99H3vS61/n30fa9L25vaLpA2YrT/K9S39v+906Xtnv3vUe897vXq6f0ofSAmR0L/lO/996Wv0vP/I60K30m0G8BaAOoGf9v5WfA+mN6P0gfivfxn/X8P8G97/16VoN7fHwHovv6296Xv6T99T//p+6S79vO2p+Ym9K/l7H9ve2puQs8Rcyv/hrP2l7Znth1Te1fbNfrf497T66p6Y0Tdyr/h3PXSXfv7Yp52t7Vto/897r36+8j7Vv6tG1z687T9re0fbc/0vmCNe08D6U9P9bY/9vH6E++v48VfI6j/AQqPz6ve0xKiuX/v1X/v9zV5f096T2mE6H7S/f6280p6f+XNzxOipY5pX8pW9B/vI9R67Yv5H9W47yS0v7Q90/vYte49vR+lD8R7+f/fA9T697v0708m7v1pW9pW9L8vT59m89M9Wp8A     document.getElementById('previewStamp1').src = STAMP_1_DATA;
    document.getElementById('previewStamp2').src = STAMP_2_DATA;

    const canvas = new fabric.Canvas('c');
    const sizeTag = document.getElementById('size-tag');
    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let originalFileName = "stamped_document";
    const A4_RATIO = 1.414;
    const BASE_WIDTH = 600;
    let currentOrientation = 'portrait';

    // PDF 状态管理变量
    let currentPdfDoc = null;
    let currentPageNum = 1;
    
    // 【关键内存优化】：使用全局唯一的离屏Canvas进行PDF渲染，防止手机端多次翻页导致内存溢出
    const pdfRenderCanvas = document.createElement('canvas');
    const pdfRenderCtx = pdfRenderCanvas.getContext('2d');

    // 初始化画布及移动端自适应显示
    function initCanvas() {
        const container = document.getElementById('container-view');
        const viewWidth = container.clientWidth - 30; 
        
        if (currentOrientation === 'portrait') {
            canvas.setWidth(BASE_WIDTH);
            canvas.setHeight(BASE_WIDTH * A4_RATIO);
        } else {
            canvas.setWidth(BASE_WIDTH * A4_RATIO);
            canvas.setHeight(BASE_WIDTH);
        }
        
        const canvasEl = document.querySelector('.canvas-container');
        if (viewWidth < canvas.width) {
            const scale = viewWidth / canvas.width;
            canvasEl.style.transform = `scale(${scale})`;
            canvasEl.style.transformOrigin = 'top center';
            document.getElementById('canvas-holder').style.height = (canvas.height * scale) + 'px';
        } else {
            canvasEl.style.transform = 'none';
            document.getElementById('canvas-holder').style.height = 'auto';
        }
        
        canvas.setBackgroundColor('#ffffff', canvas.renderAll.bind(canvas));
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();

    // 显示印章缩放百分比
    function updateSizeTag(obj) {
        if (!obj || obj.type !== 'image') return;
        const scalePercent = Math.round(obj.scaleX * 100);
        sizeTag.innerText = `缩放: ${scalePercent}%`;
        sizeTag.style.display = 'block';
        
        const boundingRect = obj.getBoundingRect();
        const canvasWrapper = document.getElementById('canvas-holder').getBoundingClientRect();
        
        sizeTag.style.left = (canvasWrapper.left + boundingRect.left + boundingRect.width / 2) + 'px';
        sizeTag.style.top = (canvasWrapper.top + boundingRect.top - 10) + 'px';
    }

    canvas.on({
        'object:scaling': (e) => updateSizeTag(e.target),
        'object:moving': (e) => updateSizeTag(e.target),
        'mouse:up': () => sizeTag.style.display = 'none',
        'touch:drag': (e) => updateSizeTag(e.target)
    });

    // ==================== 文件处理与 PDF 分页核心 ====================
    document.getElementById('fileInput').addEventListener('change', e => handleFile(e.target.files[0]));

    async function handleFile(file) {
        if (!file) return;
        const lastDotIndex = file.name.lastIndexOf('.');
        originalFileName = lastDotIndex !== -1 ? file.name.substring(0, lastDotIndex) : file.name;
        
        showLoading(true);
        if (file.type === 'application/pdf') {
            const reader = new FileReader();
            reader.onload = async function() {
                try {
                    const pdfData = new Uint8Array(this.result);
                    // 加载整个 PDF 文档
                    currentPdfDoc = await pdfjsLib.getDocument({data: pdfData}).promise;
                    currentPageNum = 1; // 默认显示第一页
                    
                    // 显示分页控制器
                    document.getElementById('pdf-controls').style.display = 'flex';
                    
                    // 渲染指定页
                    renderPdfPage(currentPageNum);
                } catch (err) {
                    alert('PDF加载失败，请检查文件或浏览器兼容性。');
                    showLoading(false);
                }
            };
            reader.readAsArrayBuffer(file);
        } else {
            // 如果是普通图片，隐藏 PDF 控制器
            currentPdfDoc = null;
            document.getElementById('pdf-controls').style.display = 'none';
            
            const reader = new FileReader();
            reader.onload = (f) => setBackground(f.target.result);
            reader.readAsDataURL(file);
        }
    }

    // 渲染 PDF 的特定页 (带内存保护与异常捕获)
    async function renderPdfPage(num) {
        if (!currentPdfDoc) return;
        showLoading(true);
        
        try {
            document.getElementById('page-info').innerText = `${num}/${currentPdfDoc.numPages}`;

            const page = await currentPdfDoc.getPage(num);
            const viewport = page.getViewport({ scale: 2 }); // 放大两倍保证清晰度
            
            // 使用全局 Canvas 避免手机端内存溢出
            pdfRenderCanvas.height = viewport.height;
            pdfRenderCanvas.width = viewport.width;
            
            await page.render({ canvasContext: pdfRenderCtx, viewport }).promise;
            
            // 转为图片设置为背景 (0.8压缩比减轻手机端渲染负担)
            setBackground(pdfRenderCanvas.toDataURL('image/jpeg', 0.8));
        } catch (e) {
            console.error(e);
            alert("页面渲染失败！");
            showLoading(false);
        }
    }

    // 翻页操作
    function changePage(offset) {
        if (!currentPdfDoc) return;
        const newPage = currentPageNum + offset;
        // 边界检查
        if (newPage >= 1 && newPage <= currentPdfDoc.numPages) {
            currentPageNum = newPage;
            renderPdfPage(currentPageNum);
        }
    }

    // 设置 Canvas 背景
    function setBackground(url) {
        fabric.Image.fromURL(url, (img) => {
            const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
            canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
                originX: 'left', originY: 'top', scaleX: scale, scaleY: scale
            });
            let txt = `已载入: ${originalFileName}`;
            if (currentPdfDoc) txt += ` (第${currentPageNum}页)`;
            document.getElementById('status-info').innerText = txt;
            showLoading(false);
        });
    }

    // ==================== 固定印章及自由上传印章 ====================
    function useFixedStamp(base64Data) {
        if (!base64Data) return;
        addStampToCanvas(base64Data);
    }

    document.getElementById('stampInput').addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (f) => {
            const imgEl = new Image();
            imgEl.src = f.target.result;
            imgEl.onload = () => {
                const processedUrl = removeWhiteBackground(imgEl);
                addStampToCanvas(processedUrl);
            }
        }
        reader.readAsDataURL(file);
    });

    function removeWhiteBackground(imgElement) {
        const tempCanvas = document.createElement('canvas');
        const ctx = tempCanvas.getContext('2d');
        tempCanvas.width = imgElement.width;
        tempCanvas.height = imgElement.height;
        ctx.drawImage(imgElement, 0, 0);
        const imageData = ctx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
            if (data[i] > 220 && data[i+1] > 220 && data[i+2] > 220) data[i + 3] = 0; 
        }
        ctx.putImageData(imageData, 0, 0);
        return tempCanvas.toDataURL('image/png');
    }

    function addStampToCanvas(url) {
        fabric.Image.fromURL(url, (img) => {
            img.scale(0.3).set({ 
                left: canvas.width/2 - 50, 
                top: canvas.height/2 - 50, 
                borderColor: '#1890ff', 
                cornerColor: '#1890ff', 
                cornerSize: 22, 
                transparentCorners: false 
            });
            canvas.add(img);
            canvas.setActiveObject(img);
        });
    }

    // 横竖屏切换
    function changeOrientation() {
        currentOrientation = document.getElementById('orientation').value;
        initCanvas();
        if (canvas.backgroundImage) {
            const bg = canvas.backgroundImage;
            const scale = Math.min(canvas.width / bg.width, canvas.height / bg.height);
            bg.set({ scaleX: scale, scaleY: scale });
            canvas.renderAll();
        }
    }

    // 下载
    function downloadImage() {
        showLoading(true);
        const dataURL = canvas.toDataURL({ format: 'jpeg', quality: 0.9, multiplier: 2 });
        const link = document.createElement('a');
        
        // 动态命名：如果PDF有多页，在文件名后标明当前是哪一页
        let dlName = `${originalFileName}_已盖章`;
        if (currentPdfDoc && currentPdfDoc.numPages > 1) {
            dlName += `_第${currentPageNum}页`;
        }
        link.download = dlName + '.jpg';
        
        link.href = dataURL;
        link.click();
        setTimeout(() => showLoading(false), 500);
    }

    function showLoading(show) { document.getElementById('loading').style.display = show ? 'block' : 'none'; }

    window.addEventListener('dragover', e => { e.preventDefault(); document.getElementById('drop-zone').style.display = 'flex'; });
    window.addEventListener('drop', e => {
        e.preventDefault();
        document.getElementById('drop-zone').style.display = 'none';
        handleFile(e.dataTransfer.files[0]);
    });
</script>

</body>
</html>
